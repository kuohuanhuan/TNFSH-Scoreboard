{% from "partials/icons.html" import icon %}
{% from "partials/macros.html" import alert with context %}
{% if success %}
<div id="change-password-form">
    {{ alert("密碼已更新，請使用新密碼重新登入。", "success") }}
    <a class="btn btn-primary" href="{{ path_for('login') }}" hx-boost="false">前往登入</a>
</div>
{% else %}
<form id="change-password-form" action="{{ path_for('change_password_submit') }}" method="post"
      hx-post="{{ path_for('change_password_submit') }}" hx-target="this" hx-swap="outerHTML"
      hx-disabled-elt="find button[type=submit]" x-data="{ showPassword: false }">
    {% if error %}{{ alert(error) }}{% endif %}

    <div class="mb-3">
        <label for="current-password" class="form-label">目前的密碼</label>
        <input id="current-password" name="current_password" type="password" :type="showPassword ? 'text' : 'password'"
               class="form-control" required autocomplete="current-password">
    </div>
    <div class="mb-3">
        <label for="new-password" class="form-label">新密碼</label>
        <input id="new-password" name="new_password" type="password" :type="showPassword ? 'text' : 'password'"
               class="form-control" required minlength="8" maxlength="30" autocomplete="new-password"
               aria-describedby="password-rules">
    </div>
    <div class="mb-3">
        <label for="confirm-password" class="form-label">再次輸入新密碼</label>
        <input id="confirm-password" name="confirm_password" type="password" :type="showPassword ? 'text' : 'password'"
               class="form-control" required minlength="8" maxlength="30" autocomplete="new-password">
    </div>
    <div class="form-check mb-4" x-cloak>
        <input class="form-check-input" type="checkbox" id="show-passwords" x-model="showPassword">
        <label class="form-check-label" for="show-passwords">顯示密碼</label>
    </div>

    <button type="submit" class="btn btn-primary">
        <span class="spinner-border spinner-border-sm btn-spinner" aria-hidden="true"></span>
        更新密碼
    </button>
</form>
{% endif %}
