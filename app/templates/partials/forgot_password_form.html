{% from "partials/macros.html" import alert with context %}
{% if success %}
<div id="forgot-password-form">
    {{ alert("申請已送出，請在 24 小時內依照校務系統寄出的通知完成密碼重設。", "success") }}
    <a class="btn btn-primary" href="{{ path_for('login') }}">回到登入</a>
</div>
{% else %}
<form id="forgot-password-form" action="{{ path_for('forgot_password_submit') }}" method="post"
      hx-post="{{ path_for('forgot_password_submit') }}" hx-target="this" hx-swap="outerHTML"
      hx-disabled-elt="find button[type=submit]">
    {% if error %}{{ alert(error) }}{% endif %}

    <div class="mb-3">
        <label for="account" class="form-label">帳號</label>
        <input id="account" name="account" class="form-control" required autocomplete="username"
               autocapitalize="off" spellcheck="false">
    </div>
    <div class="mb-3">
        <label for="name" class="form-label">姓名</label>
        <input id="name" name="name" class="form-control" required autocomplete="name">
    </div>
    <div class="mb-3">
        <label for="birthday" class="form-label">生日</label>
        <input id="birthday" name="birthday" type="date" class="form-control" required min="1950-01-01" autocomplete="bday">
    </div>
    <div class="mb-4">
        <label for="id-number" class="form-label">身分證字號</label>
        <input id="id-number" name="id_number" class="form-control text-uppercase" required
               pattern="[A-Za-z][12][0-9]{8}" maxlength="10" autocapitalize="characters" spellcheck="false"
               aria-describedby="id-number-help">
        <div class="form-text" id="id-number-help">例如 A123456789</div>
    </div>

    <button type="submit" class="btn btn-primary">
        <span class="spinner-border spinner-border-sm btn-spinner" aria-hidden="true"></span>
        送出申請
    </button>
</form>
{% endif %}
