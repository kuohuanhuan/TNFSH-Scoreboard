<div class="toast show align-items-center text-bg-{{ level }} border-0" role="alert" aria-live="assertive" aria-atomic="true"
     x-data x-init="setTimeout(() => $el.remove(), 6000)">
    <div class="d-flex">
        <div class="toast-body">{{ message }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="關閉" @click="$el.closest('.toast').remove()"></button>
    </div>
</div>
